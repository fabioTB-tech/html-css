<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            border: 2px dashed red;
            display: flex;
            flex-flow: column nowrap;
        }

        header {
            background-color: grey;
            width: 100%;
        }

        nav {
            background-color: darkgrey;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teste</h1>
    </header>
    <nav>
        <p>home</p>
        <p>options</p>
    </nav>
    <article>

    </article>
</body>
</html>
